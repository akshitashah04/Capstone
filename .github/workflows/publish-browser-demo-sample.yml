name: Publish compact browser sample to project branch

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.ref == 'refs/heads/build-nyu-search-demo'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download only the compact browser sample
        uses: actions/download-artifact@v4
        with:
          name: browser-demo-sample
          path: sample-artifact
          github-token: ${{ github.token }}
          run-id: 44054267545
      - name: Verify all files against the sample manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('sample-artifact')
          manifest = json.loads((root / 'manifest.json').read_text())
          assert manifest['schema'] == 1
          assert manifest['books'] == 1884
          assert manifest['vector_encoding'] == 'float16-le-row-major'
          expected = {'catalog.json', 'e5-small.f16', 'e5-base.f16', 'gte-base.f16'}
          assert set(manifest['files']) == expected
          assert {p.name for p in root.iterdir()} == expected | {'manifest.json'}
          books = json.loads((root / 'catalog.json').read_text())
          assert len(books) == 1884
          assert len({book['id'] for book in books}) == len(books)
          for name, details in manifest['files'].items():
              data = (root / name).read_bytes()
              assert len(data) == details['bytes']
              assert hashlib.sha256(data).hexdigest() == details['sha256']
              if name.endswith('.f16'):
                  key = name.removesuffix('.f16')
                  assert len(data) == 2 * len(books) * manifest['models'][key]['dimensions']
          print('Verified 1,884 books and all three aligned vector files')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Commit the small sample as shared project data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp sample-artifact/* frontend/public/data/
          node feedback-api/scripts/sync-catalog.mjs --refresh-manifest
          node --test feedback-api/test/*.test.js
          git add -f frontend/public/data feedback-api/worker/known-books.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Publish compact browser demo catalog and vectors'
          git push origin HEAD:build-nyu-search-demo
