name: Test and deploy Capstone sites
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run evaluate
      - run: npm run build
      - run: npm ci --prefix proposal
      - run: npm --prefix proposal test
      - run: npm --prefix proposal run build
      - run: cp -R proposal/dist dist/proposal
      - run: npm ci --prefix violet-library/frontend
      - run: npm test --prefix violet-library/frontend
      - run: node --test violet-library/feedback-api/test/*.test.js
      - run: npm run build --prefix violet-library/frontend
        env:
          VITE_RELEASE_ID: ${{ github.sha }}
          VITE_FEEDBACK_API_URL: https://violet-library-capstone-feedback.sound-park-7168.chatgpt.site
      - run: cp -R violet-library/frontend/dist dist/libraries
      - name: Select GitHub Actions as the Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pages="repos/${GITHUB_REPOSITORY}/pages"
          if [ "$(gh api "$pages" --jq .build_type)" != workflow ]; then
            gh api --method PUT "$pages" -f build_type=workflow
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the public Violet Library route
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -eu
          demo="${PAGE_URL%/}/libraries"
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 "$demo/" -o violet-index.html
          grep -F 'Find open-access books' violet-index.html
          curl --fail --silent --show-error --retry 3 --retry-all-errors "$demo/data/manifest.json" -o violet-data.json
          node -e 'const m=require("./violet-data.json"); if (m.books + m.supplemental_books !== 1891) process.exit(1)'
