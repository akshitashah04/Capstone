name: Test and deploy Capstone sites
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    outputs:
      violet_catalog: ${{ steps.violet-catalog.outputs.checksum }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run evaluate
      - run: npm run build
      - run: npm ci --prefix proposal
      - run: npm --prefix proposal test
      - run: npm --prefix proposal run build
      - run: cp -R proposal/dist dist/proposal
      - run: npm ci --prefix violet-library/frontend
      - run: npm test --prefix violet-library/frontend
      - run: node --test violet-library/feedback-api/test/*.test.js
      - run: npm run build --prefix violet-library/frontend
        env:
          VITE_RELEASE_ID: ${{ github.sha }}
          VITE_FEEDBACK_API_URL: https://violet-library-capstone-feedback.sound-park-7168.chatgpt.site
      - run: cp -R violet-library/frontend/dist dist/libraries
      - id: violet-catalog
        run: node -p '"checksum=" + require("./dist/libraries/data/manifest.json").catalog_sha256' >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the public Violet Library route
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          CATALOG_SHA: ${{ needs.build.outputs.violet_catalog }}
        run: |
          set -eu
          demo="${PAGE_URL%/}/libraries"
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 "$demo/" -o violet-index.html
          grep -F 'Find open-access books' violet-index.html
          grep -F 'For a required title or phrase, put it in quotation marks.' violet-index.html
          curl --fail --silent --show-error --retry 3 --retry-all-errors "$demo/data/manifest.json" -o violet-data.json
          grep -F 'Direct full text only' violet-index.html
          grep -F '<legend>Filter books</legend>' violet-index.html
          grep -F 'Edit filters' violet-index.html
          grep -F 'Export citations (RIS)' violet-index.html
          curl --fail --silent --show-error --retry 3 --retry-all-errors "$demo/data/prepared/gte-base.json" -o violet-prepared.json
          curl --fail --silent --show-error --retry 3 --retry-all-errors "$demo/data/prepared/gte-base.f32" -o violet-vectors.f32
          node -e 'const m=require("./violet-prepared.json"), b=require("fs").readFileSync("violet-vectors.f32"); if (m.catalog !== process.env.CATALOG_SHA || m.bytes !== b.length || m.sha256 !== require("crypto").createHash("sha256").update(b).digest("hex")) process.exit(1)'
          curl --fail --silent --show-error --retry 3 --retry-all-errors "$demo/reading/manhattan/13842-h.htm" -o manhattan.html
          grep -i -m 1 'the story of manhattan' manhattan.html
          curl --fail --silent --show-error --retry 3 --retry-all-errors "$demo/reading/new-york-metropolis/64572-h.htm" -o metropolis.html
          grep -i -m 1 'The Project Gutenberg eBook of New York, by Peter Marcus' metropolis.html
          curl --fail --silent --show-error --retry 3 --retry-all-errors "$demo/reading/cassells-vegetarian-cookery/14594-h.htm" -o cassells.html
          grep -i -m 1 "END OF THIS PROJECT GUTENBERG EBOOK CASSELL'S VEGETARIAN COOKERY" cassells.html
          curl --fail --silent --show-error --retry 3 --retry-all-errors "$demo/reading/practical-vegetarian-cookery/69812-h.htm" -o practical.html
          grep -i -m 1 'END OF THE PROJECT GUTENBERG EBOOK PRACTICAL VEGETARIAN COOKERY' practical.html
          node -e 'const m=require("./violet-data.json"); if (!m.catalog_sha256 || m.catalog_sha256 !== process.env.CATALOG_SHA) process.exit(1)'
