name: Violet Library semantic audit

on:
  push:
    branches: [main, violet-semantic-audit]
    paths:
      - '.github/workflows/violet-semantic-audit.yml'
      - 'violet-library/frontend/**'
      - 'violet-library/evaluation/queries/browser-semantic-audit.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix violet-library/frontend --ignore-scripts
      - uses: actions/cache@v4
        with:
          path: /tmp/violet-library-audit-models
          key: violet-browser-models-${{ runner.os }}-${{ hashFiles('violet-library/frontend/src/model-config.ts') }}
      - run: node violet-library/frontend/scripts/semantic-audit.mjs
      - run: node violet-library/frontend/scripts/check-reading-links.mjs
