name: Measure and prepare Violet Library semantic models

on:
  push:
    branches: [violet-library-performance]
    paths:
      - '.github/workflows/violet-build-vectors.yml'
      - 'violet-library/frontend/public/data/multilingual.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
      VIOLET_SAVE_SUPPLEMENT: '1'
      VIOLET_REPORT_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix violet-library/frontend --ignore-scripts
      - uses: actions/cache@v4
        with:
          path: /tmp/violet-library-audit-models
          key: violet-browser-models-${{ runner.os }}-${{ hashFiles('violet-library/frontend/src/model-config.ts') }}
      - name: Measure the three pinned models and export their book vectors
        run: |
          set -eu
          for model in e5-small gte-base e5-base; do
            VIOLET_AUDIT_MODEL="$model" node violet-library/frontend/scripts/semantic-audit.mjs
          done
      - name: Save vectors to the performance branch
        if: github.ref == 'refs/heads/violet-library-performance'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add violet-library/frontend/public/data/prepared
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Store precomputed supplemental embeddings'
          git push origin HEAD:violet-library-performance
      - name: Run the mobile search in WebKit
        run: |
          npm ci
          npx playwright install --with-deps webkit
          npm run build --prefix violet-library/frontend
          node scripts/check-violet-mobile.mjs
