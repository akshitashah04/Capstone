<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1250" viewBox="0 0 1100 1250" role="img" aria-labelledby="title desc"><title id="title">NYU Library Next research pipeline</title><desc id="desc">Source attribution, text coverage, Unicode tokenization, small LSA embeddings, retrieval, feedback, and evaluation.</desc><rect width="1100" height="1250" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#321044}.head{font-size:32px;font-weight:bold}.label{font-size:24px;font-weight:bold}.body{font-size:18px}</style><text x="60" y="65" class="head">NYU Library Next · Sponsor research workflow</text><text x="60" y="105" class="body">November 17 follow-up · implemented pilot · no large language model required</text><rect x="60" y="140" width="980" height="110" rx="8" fill="#f4eef9" stroke="#b79bcd"/><rect x="60" y="140" width="6" height="110" fill="#57068c"/><text x="85" y="178" class="label">Attributed collections</text><text x="85" y="215" class="body">329 OpenSquare records + 4 research pilot records; Hindi and Chinese metadata.</text><path d="M550 250 v35" stroke="#57068c" stroke-width="3"/><rect x="60" y="285" width="980" height="110" rx="8" fill="#f4eef9" stroke="#b79bcd"/><rect x="60" y="285" width="6" height="110" fill="#57068c"/><text x="85" y="323" class="label">Text coverage</text><text x="85" y="360" class="body">Metadata / opening 10% / complete digital text; source hashes retained.</text><path d="M550 395 v35" stroke="#57068c" stroke-width="3"/><rect x="60" y="430" width="980" height="110" rx="8" fill="#f4eef9" stroke="#b79bcd"/><rect x="60" y="430" width="6" height="110" fill="#57068c"/><text x="85" y="468" class="label">Tokenization and chunks</text><text x="85" y="505" class="body">Unicode-aware scripts; English stems; 180-word chunks with 30-word overlap.</text><path d="M550 540 v35" stroke="#57068c" stroke-width="3"/><rect x="60" y="575" width="980" height="110" rx="8" fill="#f4eef9" stroke="#b79bcd"/><rect x="60" y="575" width="6" height="110" fill="#57068c"/><text x="85" y="613" class="label">Small corpus model</text><text x="85" y="650" class="body">TF-IDF → SVD → 64-dimensional LSA; frozen across all comparison modes.</text><path d="M550 685 v35" stroke="#57068c" stroke-width="3"/><rect x="60" y="720" width="980" height="110" rx="8" fill="#f4eef9" stroke="#b79bcd"/><rect x="60" y="720" width="6" height="110" fill="#57068c"/><text x="85" y="758" class="label">Retrieval and aggregation</text><text x="85" y="795" class="body">60% semantic + 40% BM25; best chunk per book; inspect original passages.</text><path d="M550 830 v35" stroke="#57068c" stroke-width="3"/><rect x="60" y="865" width="980" height="110" rx="8" fill="#f4eef9" stroke="#b79bcd"/><rect x="60" y="865" width="6" height="110" fill="#57068c"/><text x="85" y="903" class="label">Feedback loop</text><text x="85" y="940" class="body">0–3 relevance judgments → bounded same-query local reranking → undo/reset.</text><path d="M550 975 v35" stroke="#57068c" stroke-width="3"/><rect x="60" y="1010" width="980" height="110" rx="8" fill="#f4eef9" stroke="#b79bcd"/><rect x="60" y="1010" width="6" height="110" fill="#57068c"/><text x="85" y="1048" class="label">Evaluation</text><text x="85" y="1085" class="body">Precision@5, Recall@5, nDCG@5, MRR; provisional checks pending librarian labels.</text><text x="60" y="1200" class="body">Main OpenSquare search retains its separate 96-dimensional metadata LSA model.</text></svg>