name: Diagnose answer-derived book retrieval

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'evaluation/queries/answer-derived.jsonl'
      - 'evaluation/queries/answer-derived-targets.json'
      - 'src/libraries_evaluation/diagnostic.py'
      - '.github/workflows/answer-derived-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: diagnose-answer-derived-book-search
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Configure temporary model cache
        run: echo "HF_HOME=$RUNNER_TEMP/hf-cache" >> "$GITHUB_ENV"
      - name: Install CPU-only PyTorch
        run: python -m pip install 'torch==2.9.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Install search and diagnostic tools
        run: python -m pip install -e '.[search]'
      - name: Search every frozen answer-derived question
        run: libraries-collect-evaluation --queries evaluation/queries/answer-derived.jsonl --index-dir "$RUNNER_TEMP/diagnostic-index" --output-dir "$RUNNER_TEMP/diagnostic-output" --top-k 10
      - name: Compare target-book recovery across modes
        run: python -m libraries_evaluation.diagnostic targets --queries evaluation/queries/answer-derived.jsonl --run-dir "$RUNNER_TEMP/diagnostic-output" --targets evaluation/queries/answer-derived-targets.json --output "$RUNNER_TEMP/diagnostic-output/target-metrics.json"
      - name: Show target metrics in GitHub
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/diagnostic-output/target-metrics.json" ]; then
            echo '## Answer-derived target recovery' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            python -c 'import json,sys; r=json.load(open(sys.argv[1])); print(json.dumps({"query_count":r["query_count"],"overall":r["overall"],"by_language":r["by_language"]},indent=2))' "$RUNNER_TEMP/diagnostic-output/target-metrics.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload small diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: answer-derived-diagnostic
          path: ${{ runner.temp }}/diagnostic-output/
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary index, model, and diagnostic files
        if: always()
        run: rm -rf "$RUNNER_TEMP/diagnostic-index" "$RUNNER_TEMP/diagnostic-output" "$HF_HOME"
