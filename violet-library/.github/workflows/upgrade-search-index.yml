name: Upgrade search metadata to v2

on:
  workflow_dispatch:
  push:
    branches: [improve-query-fit-and-catalog-coverage]
    paths:
      - 'src/libraries_search/upgrade.py'
      - 'src/libraries_search/lexical.py'
      - 'src/libraries_search/publish.py'
      - 'src/libraries_search/config.py'
      - '.github/workflows/upgrade-search-index.yml'

permissions:
  contents: read

concurrency:
  group: publish-hf-libraries-book-data
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Build checked v2 metadata index from pinned source and v1 vectors
        run: python -m libraries_search.upgrade --cache-dir "$RUNNER_TEMP/hf-cache" --output-dir "$RUNNER_TEMP/search-v2"
      - name: Publish v2 without replacing v1
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: libraries-publish-index --input-dir "$RUNNER_TEMP/search-v2"
      - uses: actions/upload-artifact@v4
        with:
          name: search-v2-manifest
          path: ${{ runner.temp }}/search-v2/manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary source and index
        if: always()
        run: rm -rf "$RUNNER_TEMP/hf-cache" "$RUNNER_TEMP/search-v2"
