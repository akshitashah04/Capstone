name: Build and publish owned search index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/libraries_search/**'
      - '.github/workflows/build-search-index.yml'

permissions:
  contents: read

concurrency:
  group: publish-hf-libraries-book-data
  cancel-in-progress: false

jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Configure temporary model and dataset cache
        run: echo "HF_HOME=$RUNNER_TEMP/hf-cache" >> "$GITHUB_ENV"
      - name: Install CPU-only PyTorch
        run: python -m pip install 'torch==2.9.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Install project search tools
        run: python -m pip install -e '.[search]'
      - name: Encode verified book shard
        run: libraries-build-shard --output-dir "$RUNNER_TEMP/search-shard" --cache-dir "$HF_HOME" --shard-index ${{ matrix.shard }} --shard-count 4
      - name: Upload temporary verified shard
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/search-shard/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Remove temporary shard and cache
        if: always()
        run: rm -rf "$RUNNER_TEMP/search-shard" "$HF_HOME"

  assemble:
    needs: encode
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Configure temporary model and dataset cache
        run: echo "HF_HOME=$RUNNER_TEMP/hf-cache" >> "$GITHUB_ENV"
      - name: Install CPU-only PyTorch
        run: python -m pip install 'torch==2.9.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Install project search tools
        run: python -m pip install -e '.[search]'
      - name: Download four temporary shards
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: ${{ runner.temp }}/search-shards/
          merge-multiple: false
      - name: Verify and assemble keyword and semantic indexes
        run: libraries-assemble-index --shards-dir "$RUNNER_TEMP/search-shards" --output-dir "$RUNNER_TEMP/search-output" --cache-dir "$HF_HOME" --shard-count 4
      - name: Run search smoke check
        run: libraries-search --input-dir "$RUNNER_TEMP/search-output" --query 'climate adaptation' --limit 3
      - name: Publish verified search artifacts
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: libraries-publish-index --input-dir "$RUNNER_TEMP/search-output"
      - name: Remove temporary input and output
        if: always()
        run: rm -rf "$RUNNER_TEMP/search-shards" "$RUNNER_TEMP/search-output" "$HF_HOME"
