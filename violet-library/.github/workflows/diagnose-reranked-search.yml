name: Diagnose reranked student search

on:
  workflow_dispatch:
  push:
    branches: [improve-query-fit-and-catalog-coverage]
    paths:
      - 'src/libraries_evaluation/rerank_diagnostic.py'
      - 'src/libraries_search/search.py'
      - 'src/libraries_search/model.py'
      - 'src/libraries_search/config.py'
      - '.github/workflows/diagnose-reranked-search.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Configure temporary model cache
        run: echo "HF_HOME=$RUNNER_TEMP/hf-cache" >> "$GITHUB_ENV"
      - name: Install CPU-only PyTorch
        run: python -m pip install 'torch==2.9.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Install search tools
        run: python -m pip install -e '.[search]'
      - name: Search frozen questions through all four methods
        run: python -m libraries_evaluation.rerank_diagnostic --queries evaluation/queries/student-personas.jsonl --index-dir "$RUNNER_TEMP/search-index" --output-dir "$RUNNER_TEMP/rerank-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reranked-student-search
          path: ${{ runner.temp }}/rerank-results/
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary index, model, and results
        if: always()
        run: rm -rf "$RUNNER_TEMP/search-index" "$RUNNER_TEMP/rerank-results" "$HF_HOME"
