name: Evaluate 50 synthetic student searches

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'evaluation/personas/student-personas.jsonl'
      - 'evaluation/queries/student-personas.jsonl'
      - 'src/libraries_evaluation/personas.py'
      - '.github/workflows/evaluate-student-personas.yml'

permissions:
  contents: read

concurrency:
  group: evaluate-50-student-personas
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Configure temporary model cache
        run: echo "HF_HOME=$RUNNER_TEMP/hf-cache" >> "$GITHUB_ENV"
      - name: Install CPU-only PyTorch
        run: python -m pip install 'torch==2.9.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Install search and evaluation tools
        run: python -m pip install -e '.[search]'
      - name: Check frozen personas and queries agree
        run: |
          python -m libraries_evaluation.personas --personas evaluation/personas/student-personas.jsonl --output "$RUNNER_TEMP/personas-generated.jsonl"
          cmp "$RUNNER_TEMP/personas-generated.jsonl" evaluation/queries/student-personas.jsonl
      - name: Run all three search modes for 50 questions
        run: libraries-collect-evaluation --queries evaluation/queries/student-personas.jsonl --index-dir "$RUNNER_TEMP/persona-index" --output-dir "$RUNNER_TEMP/persona-results" --top-k 10
      - name: Upload compact results for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-persona-search-results
          path: ${{ runner.temp }}/persona-results/
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary index, model, and results
        if: always()
        run: rm -rf "$RUNNER_TEMP/persona-index" "$RUNNER_TEMP/persona-results" "$HF_HOME"
