name: Compare multilingual book embedding models

on:
  push:
    branches: [test-multilingual-embedding-models]
    paths:
      - '.github/workflows/compare-embedding-models.yml'
      - 'src/libraries_evaluation/embedding_model_trial.py'
      - 'tests/test_embedding_model_trial.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Keep all model and source files on temporary runner storage
        run: echo "HF_HOME=$RUNNER_TEMP/hf-cache" >> "$GITHUB_ENV"
      - name: Install CPU-only PyTorch
        run: python -m pip install 'torch==2.9.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Install project search tools
        run: python -m pip install -e '.[search]'
      - name: Pin compatible Transformers version for GTE
        run: python -m pip install 'transformers==4.57.6'
      - name: Encode one checked book shard
        run: >-
          python -m libraries_evaluation.embedding_model_trial encode
          --model gte-base
          --shard-index "${{ matrix.shard }}"
          --shard-count 8
          --cache-dir "$HF_HOME"
          --output-dir "$RUNNER_TEMP/trial-shard"
      - name: Upload short-lived vector shard
        uses: actions/upload-artifact@v4
        with:
          name: gte-base-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/trial-shard/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Remove temporary source, model, and vectors
        if: always()
        run: rm -rf "$RUNNER_TEMP/trial-shard" "$HF_HOME"

  evaluate_e5:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Keep all model and index files on temporary runner storage
        run: echo "HF_HOME=$RUNNER_TEMP/hf-cache" >> "$GITHUB_ENV"
      - name: Install CPU-only PyTorch
        run: python -m pip install 'torch==2.9.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Install project search tools
        run: python -m pip install -e '.[search]'
      - name: Pin compatible Transformers version for GTE
        run: python -m pip install 'transformers==4.57.6'
      - name: Reuse checked E5 shards from the completed encode run
        uses: actions/download-artifact@v4
        with:
          pattern: e5-base-shard-*
          path: ${{ runner.temp }}/trial-shards/
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: 43848201040
      - name: Restore standard shard directory names
        run: |
          for shard in 0 1 2 3; do
            mv "$RUNNER_TEMP/trial-shards/e5-base-shard-$shard" \
              "$RUNNER_TEMP/trial-shards/shard-$shard"
          done
      - name: Verify, assemble, and compare the same 50 questions
        run: >-
          python -m libraries_evaluation.embedding_model_trial evaluate
          --model e5-base
          --shard-count 4
          --shards-dir "$RUNNER_TEMP/trial-shards"
          --cache-dir "$HF_HOME"
          --index-dir "$RUNNER_TEMP/trial-index"
          --queries evaluation/queries/student-personas.jsonl
          --output-dir "$RUNNER_TEMP/trial-results"
      - name: Upload compact unjudged rankings and timings
        uses: actions/upload-artifact@v4
        with:
          name: e5-base-trial-results
          path: ${{ runner.temp }}/trial-results/
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary source, model, and full index
        if: always()
        run: >-
          rm -rf "$RUNNER_TEMP/trial-shards" "$RUNNER_TEMP/trial-index"
          "$RUNNER_TEMP/trial-results" "$HF_HOME"

  evaluate_gte:
    needs: encode
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Keep all model and index files on temporary runner storage
        run: echo "HF_HOME=$RUNNER_TEMP/hf-cache" >> "$GITHUB_ENV"
      - name: Install CPU-only PyTorch
        run: python -m pip install 'torch==2.9.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Install project search tools
        run: python -m pip install -e '.[search]'
      - name: Pin compatible Transformers version for GTE
        run: python -m pip install 'transformers==4.57.6'
      - name: Download checked temporary shards
        uses: actions/download-artifact@v4
        with:
          pattern: gte-base-shard-*
          path: ${{ runner.temp }}/trial-shards/
          merge-multiple: false
      - name: Restore standard shard directory names
        run: |
          for shard in 0 1 2 3 4 5 6 7; do
            mv "$RUNNER_TEMP/trial-shards/gte-base-shard-$shard" \
              "$RUNNER_TEMP/trial-shards/shard-$shard"
          done
      - name: Verify, assemble, and compare the same 50 questions
        run: >-
          python -m libraries_evaluation.embedding_model_trial evaluate
          --model gte-base
          --shard-count 8
          --shards-dir "$RUNNER_TEMP/trial-shards"
          --cache-dir "$HF_HOME"
          --index-dir "$RUNNER_TEMP/trial-index"
          --queries evaluation/queries/student-personas.jsonl
          --output-dir "$RUNNER_TEMP/trial-results"
      - name: Upload compact unjudged rankings and timings
        uses: actions/upload-artifact@v4
        with:
          name: gte-base-trial-results
          path: ${{ runner.temp }}/trial-results/
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary source, model, and full index
        if: always()
        run: >-
          rm -rf "$RUNNER_TEMP/trial-shards" "$RUNNER_TEMP/trial-index"
          "$RUNNER_TEMP/trial-results" "$HF_HOME"
