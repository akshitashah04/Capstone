name: Audit pinned book metadata

on:
  workflow_dispatch:
  push:
    branches: [improve-query-fit-and-catalog-coverage]
    paths:
      - 'src/libraries_evaluation/metadata_audit.py'
      - '.github/workflows/audit-book-metadata.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project
        run: python -m pip install -e . 'numpy>=1.26,<3'
      - name: Audit pinned source on temporary storage
        run: python -m libraries_evaluation.metadata_audit --cache-dir "$RUNNER_TEMP/hf-cache" --output "$RUNNER_TEMP/metadata-audit.json"
      - uses: actions/upload-artifact@v4
        with:
          name: metadata-audit
          path: ${{ runner.temp }}/metadata-audit.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary source
        if: always()
        run: rm -rf "$RUNNER_TEMP/hf-cache" "$RUNNER_TEMP/metadata-audit.json"
