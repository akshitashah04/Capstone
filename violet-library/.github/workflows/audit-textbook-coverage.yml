name: Audit supplementary textbook coverage

on:
  workflow_dispatch:
  push:
    branches: [improve-query-fit-and-catalog-coverage]
    paths:
      - 'src/libraries_evaluation/otl_coverage.py'
      - '.github/workflows/audit-textbook-coverage.yml'

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Configure temporary model cache
        run: echo "HF_HOME=$RUNNER_TEMP/hf-cache" >> "$GITHUB_ENV"
      - name: Install CPU-only PyTorch
        run: python -m pip install 'torch==2.9.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Install project search tools
        run: python -m pip install -e '.[search]'
      - name: Build temporary index from the unfiltered textbook CSV and check misses
        run: python -m libraries_evaluation.otl_coverage --queries evaluation/queries/student-personas.jsonl --miss-report evaluation/personas/miss-audit.json --output-dir "$RUNNER_TEMP/otl-coverage"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: textbook-coverage-report
          path: |
            ${{ runner.temp }}/otl-coverage/source-quality.json
            ${{ runner.temp }}/otl-coverage/coverage-manifest.json
            ${{ runner.temp }}/otl-coverage/coverage-results.csv
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary catalog, index, and model
        if: always()
        run: rm -rf "$RUNNER_TEMP/otl-coverage" "$HF_HOME"
